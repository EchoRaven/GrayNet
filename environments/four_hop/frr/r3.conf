frr version 10.4.1
frr defaults traditional
hostname r3
log stdout
!
router bgp 65003
 bgp router-id 3.3.3.3
 no bgp ebgp-requires-policy
 neighbor 10.23.0.1 remote-as 65002
 neighbor 10.23.0.1 advertisement-interval 0
 neighbor 10.34.0.2 remote-as 65004
 neighbor 10.34.0.2 advertisement-interval 0
 !
 address-family ipv4 unicast
  redistribute connected
  network 10.4.0.0/24
 exit-address-family
!
