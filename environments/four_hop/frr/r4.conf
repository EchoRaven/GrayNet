frr version 10.4.1
frr defaults traditional
hostname r4
log stdout
!
router bgp 65004
 bgp router-id 4.4.4.4
 no bgp ebgp-requires-policy
 neighbor 10.34.0.1 remote-as 65003
 neighbor 10.34.0.1 advertisement-interval 0
 !
 address-family ipv4 unicast
  redistribute connected
  network 10.2.0.0/24
 exit-address-family
!
