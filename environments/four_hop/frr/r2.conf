frr version 10.4.1
frr defaults traditional
hostname r2
log stdout
!
router bgp 65002
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 neighbor 10.12.0.1 remote-as 65001
 neighbor 10.12.0.1 advertisement-interval 0
 neighbor 10.23.0.2 remote-as 65003
 neighbor 10.23.0.2 advertisement-interval 0
 !
 address-family ipv4 unicast
  redistribute connected
  network 10.3.0.0/24
 exit-address-family
!
