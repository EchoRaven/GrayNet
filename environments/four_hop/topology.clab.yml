name: graynet-four-hop
topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/r1.conf:/etc/frr/frr.conf:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
      exec:
        - ip addr add 10.1.0.1/24 dev eth1
        - ip addr add 10.12.0.1/30 dev eth2
        - sysctl -w net.ipv4.ip_forward=1
        - tc qdisc replace dev eth1 root netem delay 10ms limit 10000
    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/r2.conf:/etc/frr/frr.conf:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
      exec:
        - ip addr add 10.12.0.2/30 dev eth1
        - ip addr add 10.23.0.1/30 dev eth2
        - ip addr add 10.3.0.1/24 dev eth3
        - sysctl -w net.ipv4.ip_forward=1
        - tc qdisc replace dev eth2 root tbf rate 40mbit burst 64kb latency 100ms
    r3:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/r3.conf:/etc/frr/frr.conf:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
      exec:
        - ip addr add 10.23.0.2/30 dev eth1
        - ip addr add 10.34.0.1/30 dev eth2
        - ip addr add 10.4.0.1/24 dev eth3
        - sysctl -w net.ipv4.ip_forward=1
    r4:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/r4.conf:/etc/frr/frr.conf:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
      exec:
        - ip addr add 10.34.0.2/30 dev eth1
        - ip addr add 10.2.0.1/24 dev eth2
        - sysctl -w net.ipv4.ip_forward=1
    user-client:
      kind: linux
      image: graynet-host:0.1
      exec:
        - ip addr add 10.1.0.2/24 dev eth1
        - ip route replace default via 10.1.0.1
    user-server:
      kind: linux
      image: graynet-host:0.1
      exec:
        - ip addr add 10.2.0.2/24 dev eth1
        - ip route replace default via 10.2.0.1
    load-client:
      kind: linux
      image: graynet-host:0.1
      exec:
        - ip addr add 10.3.0.2/24 dev eth1
        - ip route replace default via 10.3.0.1
    load-server:
      kind: linux
      image: graynet-host:0.1
      exec:
        - ip addr add 10.4.0.2/24 dev eth1
        - ip route replace default via 10.4.0.1
  links:
    - endpoints: [user-client:eth1, r1:eth1]
    - endpoints: [r1:eth2, r2:eth1]
    - endpoints: [r2:eth2, r3:eth1]
    - endpoints: [r3:eth2, r4:eth1]
    - endpoints: [r4:eth2, user-server:eth1]
    - endpoints: [load-client:eth1, r2:eth3]
    - endpoints: [load-server:eth1, r3:eth3]
