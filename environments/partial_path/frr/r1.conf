frr version 10.4.1
frr defaults traditional
hostname r1
log stdout
!
ip prefix-list ALPHA seq 10 permit 10.2.0.0/24
ip prefix-list BETA seq 10 permit 10.4.0.0/24
!
route-map PREFER-ALPHA permit 10
 match ip address prefix-list ALPHA
 set weight 200
route-map PREFER-ALPHA permit 20
 set weight 100
!
route-map PREFER-BETA permit 10
 match ip address prefix-list BETA
 set weight 200
route-map PREFER-BETA permit 20
 set weight 100
!
router bgp 65001
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 neighbor 10.12.0.2 remote-as 65002
 neighbor 10.12.1.2 remote-as 65002
 !
 address-family ipv4 unicast
  network 10.1.0.0/24
  network 10.3.0.0/24
  neighbor 10.12.0.2 route-map PREFER-ALPHA in
  neighbor 10.12.1.2 route-map PREFER-BETA in
 exit-address-family
!
