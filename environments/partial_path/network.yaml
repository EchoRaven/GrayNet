schema_version: 1
data_plane_mtu: 1500
service_min_fraction: 0.75
managed_nodes:
  r1: router
  r2: router
  alpha-client: host
  alpha-server: host
  beta-client: host
  beta-server: host
public_addresses:
  - 10.1.0.1
  - 10.1.0.2
  - 10.2.0.1
  - 10.2.0.2
  - 10.3.0.1
  - 10.3.0.2
  - 10.4.0.1
  - 10.4.0.2
  - 10.12.0.1
  - 10.12.0.2
  - 10.12.1.1
  - 10.12.1.2
bgp_peers:
  r1: [10.12.0.2, 10.12.1.2]
  r2: [10.12.0.1, 10.12.1.1]
routes:
  alpha-forward: {node: r1, destination: 10.2.0.2, via: 10.12.0.2, interface: eth3}
  alpha-return: {node: r2, destination: 10.1.0.2, via: 10.12.0.1, interface: eth1}
  beta-forward: {node: r1, destination: 10.4.0.2, via: 10.12.1.2, interface: eth4}
  beta-return: {node: r2, destination: 10.3.0.2, via: 10.12.1.1, interface: eth2}
flows:
  alpha:
    client: alpha-client
    client_ip: 10.1.0.2
    server: alpha-server
    server_ip: 10.2.0.2
    forward: alpha-forward
    return: alpha-return
  beta:
    client: beta-client
    client_ip: 10.3.0.2
    server: beta-server
    server_ip: 10.4.0.2
    forward: beta-forward
    return: beta-return
