name: graynet-partial-path
topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/r1.conf:/etc/frr/frr.conf:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
      exec:
        - ip addr add 10.1.0.1/24 dev eth1
        - ip addr add 10.3.0.1/24 dev eth2
        - ip addr add 10.12.0.1/30 dev eth3
        - ip addr add 10.12.1.1/30 dev eth4
        - sysctl -w net.ipv4.ip_forward=1
        - tc qdisc replace dev eth1 root netem delay 20ms limit 10000
        - tc qdisc replace dev eth2 root netem delay 20ms limit 10000
        - tc qdisc replace dev eth3 root netem limit 10000
        - tc qdisc replace dev eth4 root netem limit 10000
    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/r2.conf:/etc/frr/frr.conf:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
      exec:
        - ip addr add 10.12.0.2/30 dev eth1
        - ip addr add 10.12.1.2/30 dev eth2
        - ip addr add 10.2.0.1/24 dev eth3
        - ip addr add 10.4.0.1/24 dev eth4
        - sysctl -w net.ipv4.ip_forward=1
    alpha-client:
      kind: linux
      image: graynet-host:0.1
      exec:
        - ip addr add 10.1.0.2/24 dev eth1
        - ip route replace default via 10.1.0.1
    alpha-server:
      kind: linux
      image: graynet-host:0.1
      exec:
        - ip addr add 10.2.0.2/24 dev eth1
        - ip route replace default via 10.2.0.1
    beta-client:
      kind: linux
      image: graynet-host:0.1
      exec:
        - ip addr add 10.3.0.2/24 dev eth1
        - ip route replace default via 10.3.0.1
    beta-server:
      kind: linux
      image: graynet-host:0.1
      exec:
        - ip addr add 10.4.0.2/24 dev eth1
        - ip route replace default via 10.4.0.1
  links:
    - endpoints: [alpha-client:eth1, r1:eth1]
    - endpoints: [beta-client:eth1, r1:eth2]
    - endpoints: [r1:eth3, r2:eth1]
    - endpoints: [r1:eth4, r2:eth2]
    - endpoints: [r2:eth3, alpha-server:eth1]
    - endpoints: [r2:eth4, beta-server:eth1]
