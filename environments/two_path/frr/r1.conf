frr version 10.4.1
frr defaults traditional
hostname r1
log stdout
!
router bgp 65001
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 neighbor 10.12.0.2 remote-as 65002
 neighbor 10.12.1.2 remote-as 65002
 !
 address-family ipv4 unicast
  network 10.1.0.0/24
  network 10.3.0.0/24
  neighbor 10.12.0.2 weight 200
  neighbor 10.12.1.2 weight 100
 exit-address-family
!
