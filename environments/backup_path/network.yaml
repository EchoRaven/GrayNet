schema_version: 1
data_plane_mtu: 1500
endpoint_cpu_affinity: single_cpu
managed_nodes:
  r1: router
  r2: router
  user-client: host
  user-server: host
public_addresses:
  - 10.1.0.1
  - 10.1.0.2
  - 10.2.0.1
  - 10.2.0.2
  - 10.3.0.1
  - 10.4.0.1
  - 10.12.0.1
  - 10.12.0.2
  - 10.12.1.1
  - 10.12.1.2
bgp_peers:
  r1: [10.12.0.2, 10.12.1.2]
  r2: [10.12.0.1, 10.12.1.1]
routes:
  user: {node: r1, destination: 10.2.0.2, via: 10.12.0.2, interface: eth3}
  return: {node: r2, destination: 10.1.0.2, via: 10.12.0.1, interface: eth1}
  load: {node: r1, destination: 10.4.0.2, via: 10.12.0.2, interface: eth3}
  load_return: {node: r2, destination: 10.3.0.2, via: 10.12.0.1, interface: eth1}
queue: {node: r1, interface: eth3, kind: tbf}
background:
  client: load-client
  server: load-server
  server_ip: 10.4.0.2
  interface: eth1
