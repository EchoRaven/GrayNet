frr version 10.4.1
frr defaults traditional
hostname r2
log stdout
!
router bgp 65002
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 neighbor 10.12.0.1 remote-as 65001
 neighbor 10.12.0.1 advertisement-interval 0
 neighbor 10.12.0.1 timers connect 1
 neighbor 10.12.1.1 remote-as 65001
 neighbor 10.12.1.1 advertisement-interval 0
 neighbor 10.12.1.1 timers connect 1
 !
 address-family ipv4 unicast
  network 10.2.0.0/24
  network 10.4.0.0/24
  neighbor 10.12.0.1 weight 200
  neighbor 10.12.1.1 weight 100
 exit-address-family
!
