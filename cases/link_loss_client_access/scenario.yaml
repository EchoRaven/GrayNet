schema_version: 1
id: link-loss-client-access-01
title: Moderate packet_loss on user-client:eth1
topology: ../../environments/two_path/topology.clab.yml
network: two_path
workload:
  kind: iperf3
  client: user-client
  server: user-server
  server_ip: 10.2.0.2
  duration_seconds: 4
  cpu_limit_cores: 0.1
fault:
  kind: link_loss
  node: user-client
  interface: eth1
  loss_percent: 2
  seed: 11
  duration_seconds: 180
ground_truth:
  diagnosis: >-
    Packet loss on the user-client:eth1--r1:eth1 access link reduces TCP
    throughput. The impaired link remains up, and routing sessions stay
    established. Evidence should support loss on this link rather than primary-
    path congestion or endpoint CPU contention. The exact configured loss rate
    is not required.
  anomaly: true
  component: user-client:eth1
  component_aliases: [r1:eth1]
  mechanism: packet_loss
validation:
  metric: throughput_mbps
  effect: degraded
  direction: decrease
  threshold: 0.20
  min_samples: 5
  max_baseline_cv: 0.15
  recovery_tolerance: 0.15
  min_affected_fraction: 0.80
