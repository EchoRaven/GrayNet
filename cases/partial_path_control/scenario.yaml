schema_version: 1
id: partial-path-control
title: Two independent service paths with no applied loss
topology: ../../environments/partial_path/topology.clab.yml
network: partial_path
workload:
  kind: iperf3
  client: alpha-client
  server: alpha-server
  server_ip: 10.2.0.2
  duration_seconds: 4
  rate_mbps: 40
  cpu_limit_cores: 0.5
fault:
  kind: none
partial_path: {}
ground_truth:
  anomaly: false
  diagnosis: >-
    Both services meet the throughput requirement. No fault is active.
validation:
  metric: throughput_mbps
  effect: stable
  threshold: 0.25
  min_samples: 5
  max_baseline_cv: 0.08
  recovery_tolerance: 0.08
  min_affected_fraction: 0.8
