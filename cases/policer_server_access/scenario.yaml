schema_version: 1
id: policer-server-access-01
title: Misconfigured traffic policer on r2:eth3
topology: ../../environments/two_path/topology.clab.yml
network: two_path
workload:
  kind: iperf3
  client: user-client
  server: user-server
  server_ip: 10.2.0.2
  duration_seconds: 4
  cpu_limit_cores: 0.1
fault:
  kind: link_police
  node: r2
  interface: eth3
  rate_mbps: 20
  duration_seconds: 180
ground_truth:
  diagnosis: >-
    A traffic policer on this link enforces a rate below the service
    requirement. Excess packets are dropped at the interface with little
    queueing, and no competing traffic explains the slowdown.
  anomaly: true
  component: r2:eth3
  component_aliases: [user-server:eth1]
  mechanism: capacity_limit
  mechanism_aliases: ["policing", "rate_limit"]
validation:
  metric: throughput_mbps
  effect: degraded
  direction: decrease
  threshold: 0.20
  min_samples: 5
  max_baseline_cv: 0.15
  recovery_tolerance: 0.15
  min_affected_fraction: 0.80
