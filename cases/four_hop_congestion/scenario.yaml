schema_version: 1
id: four-hop-congestion-01
title: Sustained congestion between r2 and r3
topology: ../../environments/four_hop/topology.clab.yml
network: four_hop
workload:
  kind: iperf3
  client: user-client
  server: user-server
  server_ip: 10.2.0.2
  duration_seconds: 4
  cpu_limit_cores: 0.1
fault:
  kind: cross_traffic
  client: load-client
  server: load-server
  server_ip: 10.4.0.2
  rate_mbps: 25
  duration_seconds: 180
ground_truth:
  diagnosis: >-
    Competing traffic congests the r2:eth2--r3:eth1 link, reducing service
    throughput while routing stays established. Queue backlog forms at r2:eth2.
  anomaly: true
  component: r2:eth2
  component_aliases: [r3:eth1, "r2:eth2--r3:eth1"]
  mechanism: congestion
  mechanism_aliases: ["cross-traffic congestion", "queue contention"]
validation:
  metric: throughput_mbps
  effect: degraded
  direction: decrease
  threshold: 0.20
  min_samples: 5
  max_baseline_cv: 0.15
  recovery_tolerance: 0.15
  min_affected_fraction: 0.80
