schema_version: 1
id: link-delay-return-path-01
title: Added delay on r2:eth1
topology: ../../environments/two_path/topology.clab.yml
network: two_path
workload:
  kind: iperf3
  client: user-client
  server: user-server
  server_ip: 10.2.0.2
  duration_seconds: 4
  cpu_limit_cores: 0.1
fault:
  kind: link_delay
  node: r2
  interface: eth1
  delay_ms: 200
  duration_seconds: 180
ground_truth:
  diagnosis: >-
    Added propagation delay on the return direction of the primary r1:eth3--
    r2:eth1 link raises RTT and reduces TCP throughput without packet drops.
    Routing sessions stay established. Segment RTT measurements should place the
    delay on this link. The exact added delay is not required.
  anomaly: true
  component: r2:eth1
  component_aliases: [r1:eth3]
  mechanism: delay
validation:
  metric: throughput_mbps
  effect: degraded
  direction: decrease
  threshold: 0.20
  min_samples: 5
  max_baseline_cv: 0.15
  recovery_tolerance: 0.15
  min_affected_fraction: 0.80
