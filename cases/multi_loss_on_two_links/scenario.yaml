schema_version: 1
id: multi-loss-on-two-links-01
title: Packet loss on both access links
topology: ../../environments/two_path/topology.clab.yml
network: two_path
workload:
  kind: iperf3
  client: user-client
  server: user-server
  server_ip: 10.2.0.2
  duration_seconds: 4
  cpu_limit_cores: 0.1
fault:
  kind: multiple
  faults:
    - kind: link_loss
      node: r2
      interface: eth3
      loss_percent: 0.5
      seed: 11
    - kind: link_loss
      node: user-client
      interface: eth1
      loss_percent: 0.5
      seed: 12
  duration_seconds: 180
ground_truth:
  diagnosis: >-
    Packet loss is present on two separate links, the server access link and the
    client access link. Identifying only one is incomplete.
  anomaly: true
  component: r2:eth3
  component_aliases: [user-server:eth1, user-client:eth1, r1:eth1]
  mechanism: multiple
validation:
  metric: throughput_mbps
  effect: degraded
  direction: decrease
  threshold: 0.20
  min_samples: 5
  max_baseline_cv: 0.15
  recovery_tolerance: 0.15
  min_affected_fraction: 0.80
