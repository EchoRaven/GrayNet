schema_version: 1
id: gradual-congestion-four-step-01
title: Gradually increasing cross traffic on a preferred path
topology: ../../environments/two_path/topology.clab.yml
network: two_path
workload:
  kind: iperf3
  client: user-client
  server: user-server
  server_ip: 10.2.0.2
  duration_seconds: 4
  cpu_limit_cores: 0.1
fault:
  kind: cross_traffic
  client: load-client
  server: load-server
  server_ip: 10.4.0.2
  rate_mbps: 38
  duration_seconds: 240
  pattern:
    kind: gradual
    step_seconds: 16
    rates_mbps: [10, 20, 30, 38]
ground_truth:
  diagnosis: >-
    Competing traffic on the primary r1:eth3--r2:eth1 path grows over time, so
    service throughput worsens across successive samples. Queue contention,
    rather than a broken routing session, causes the slowdown. An agent need not
    identify the exact rates.
  anomaly: true
  component: r1-r2-primary
  component_aliases: [r1:eth3, r2:eth1, "r1:eth3--r2:eth1"]
  mechanism: congestion
  mechanism_aliases: ["cross-traffic congestion", "queue contention"]
validation:
  metric: throughput_mbps
  effect: degraded
  direction: decrease
  threshold: 0.20
  min_samples: 16
  pattern: gradual
  max_baseline_cv: 0.15
  recovery_tolerance: 0.15
  min_affected_fraction: 0.80
