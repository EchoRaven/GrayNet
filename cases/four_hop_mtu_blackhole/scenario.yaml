schema_version: 1
id: four-hop-mtu-blackhole-01
title: MTU black hole between r3 and r4
topology: ../../environments/four_hop/topology.clab.yml
network: four_hop
workload:
  kind: iperf3
  client: user-client
  server: user-server
  server_ip: 10.2.0.2
  duration_seconds: 4
  cpu_limit_cores: 0.1
fault:
  kind: link_mtu
  node: r3
  interface: eth2
  mtu: 1200
  icmp_interface: eth1
  duration_seconds: 180
ground_truth:
  diagnosis: >-
    The MTU on the r3:eth2 link is smaller than the end-to-end path expects, and
    the router's fragmentation-needed messages do not reach the sender. Small
    packets and ping succeed, routing stays established, but full-size TCP
    segments are dropped and transfers stall. Interface MTU values should reveal
    the mismatch.
  anomaly: true
  component: r3:eth2
  component_aliases: [r4:eth1]
  mechanism: mtu_mismatch
validation:
  metric: throughput_mbps
  effect: degraded
  direction: decrease
  threshold: 0.20
  min_samples: 5
  max_baseline_cv: 0.15
  recovery_tolerance: 0.15
  min_affected_fraction: 0.80
