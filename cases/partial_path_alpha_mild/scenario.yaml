schema_version: 1
id: partial-path-alpha-mild
title: Selective inter-router loss for alpha (mild)
topology: ../../environments/partial_path/topology.clab.yml
network: partial_path
workload:
  kind: iperf3
  client: alpha-client
  server: alpha-server
  server_ip: 10.2.0.2
  duration_seconds: 4
  rate_mbps: 40
  cpu_limit_cores: 0.5
fault:
  kind: link_loss
  node: r1
  interface: eth3
  loss_percent: 0.085
  seed: 11
  duration_seconds: 180
partial_path:
  flow: alpha
  min_slowdown: 0.04
  max_slowdown: 0.24
ground_truth:
  anomaly: false
  diagnosis: >-
    Loss slows alpha, but both services still meet their throughput requirements.
    A measured slowdown is not necessarily a service violation.
validation:
  metric: throughput_mbps
  effect: stable
  threshold: 0.25
  min_samples: 5
  max_baseline_cv: 0.08
  recovery_tolerance: 0.08
  min_affected_fraction: 0.8
