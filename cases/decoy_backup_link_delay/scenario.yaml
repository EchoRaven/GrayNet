schema_version: 1
id: decoy-backup-link-delay-01
title: Added delay on the unused backup link
topology: ../../environments/two_path/topology.clab.yml
network: two_path
benign_fault: true
workload:
  kind: iperf3
  client: user-client
  server: user-server
  server_ip: 10.2.0.2
  duration_seconds: 4
  cpu_limit_cores: 0.1
fault:
  kind: link_delay
  node: r2
  interface: eth2
  delay_ms: 100
  duration_seconds: 180
ground_truth:
  diagnosis: >-
    Added delay affects only the backup r2:eth2 link, which carries no service
    traffic because routing prefers the primary link. Service throughput remains
    within its requirement, so there is no service degradation.
  anomaly: false
validation:
  metric: throughput_mbps
  effect: stable
  threshold: 0.20
  min_samples: 5
  max_baseline_cv: 0.15
  recovery_tolerance: 0.15
  min_affected_fraction: 0.80
