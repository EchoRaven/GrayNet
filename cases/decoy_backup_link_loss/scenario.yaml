schema_version: 1
id: decoy-backup-link-loss-01
title: Packet loss on the unused backup link
topology: ../../environments/two_path/topology.clab.yml
network: two_path
benign_fault: true
workload:
  kind: iperf3
  client: user-client
  server: user-server
  server_ip: 10.2.0.2
  duration_seconds: 4
  cpu_limit_cores: 0.1
fault:
  kind: link_loss
  node: r1
  interface: eth4
  loss_percent: 5
  seed: 11
  duration_seconds: 180
ground_truth:
  diagnosis: >-
    Packet loss affects only the backup r1:eth4 link, which carries no service
    traffic because routing prefers the primary link. Service throughput remains
    within its requirement, so there is no service degradation. Reporting an
    incident from the existence of this condition alone is incorrect.
  anomaly: false
validation:
  metric: throughput_mbps
  effect: stable
  threshold: 0.20
  min_samples: 5
  max_baseline_cv: 0.15
  recovery_tolerance: 0.15
  min_affected_fraction: 0.80
