schema_version: 1
id: multi-delay-and-congestion-01
title: Client access delay and primary path congestion
topology: ../../environments/two_path/topology.clab.yml
network: two_path
workload:
  kind: iperf3
  client: user-client
  server: user-server
  server_ip: 10.2.0.2
  duration_seconds: 4
  cpu_limit_cores: 0.1
fault:
  kind: multiple
  faults:
    - kind: link_delay
      node: user-client
      interface: eth1
      delay_ms: 150
    - kind: cross_traffic
      client: load-client
      server: load-server
      server_ip: 10.4.0.2
      rate_mbps: 20
  duration_seconds: 180
ground_truth:
  diagnosis: >-
    Two independent problems are active: added delay on the client access link
    and competing traffic on the primary r1:eth3--r2:eth1 path. An explanation
    of only one of them is incomplete.
  anomaly: true
  component: r1-r2-primary
  component_aliases: [r1:eth3, r2:eth1, "r1:eth3--r2:eth1", user-client:eth1]
  mechanism: multiple
validation:
  metric: throughput_mbps
  effect: degraded
  direction: decrease
  threshold: 0.20
  min_samples: 5
  max_baseline_cv: 0.15
  recovery_tolerance: 0.15
  min_affected_fraction: 0.80
